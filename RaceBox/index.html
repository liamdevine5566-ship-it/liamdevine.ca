*{box-sizing:border-box}
.amb{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.amb i{position:absolute;display:block;border-radius:50%;filter:blur(80px);opacity:.34}
.amb i:nth-child(1){width:74vw;height:74vw;background:#1b4fd8;top:-22vw;left:-24vw;animation:d1 38s ease-in-out infinite}
.amb i:nth-child(2){width:54vw;height:54vw;background:#b0263a;bottom:-16vw;right:-18vw;animation:d2 46s ease-in-out infinite}
.amb i:nth-child(3){width:44vw;height:44vw;background:#0b6f86;top:44%;left:42%;animation:d3 53s ease-in-out infinite}
@keyframes d1{50%{transform:translate3d(9vw,7vw,0) scale(1.14)}}
@keyframes d2{50%{transform:translate3d(-8vw,-6vw,0) scale(1.18)}}
@keyframes d3{50%{transform:translate3d(-11vw,9vw,0) scale(.86)}}
.wrap{position:relative;z-index:1}

.g{position:relative;background:rgba(255,255,255,.052);
  backdrop-filter:blur(30px) saturate(190%);-webkit-backdrop-filter:blur(30px) saturate(190%);
  border:1px solid rgba(255,255,255,.10);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.17),inset 0 -1px 0 rgba(255,255,255,.04),0 14px 38px rgba(0,0,0,.44)}
.g::before{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(148deg,rgba(255,255,255,.15),rgba(255,255,255,0) 44%)}
.g>*{position:relative}

.r-hero{border-radius:30px}
.r-card{border-radius:20px}
