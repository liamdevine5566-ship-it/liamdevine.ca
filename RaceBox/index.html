*{box-sizing:border-box}
.amb{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.amb i{position:absolute;display:block;border-radius:50%;filter:blur(90px);opacity:.30}
.amb i:nth-child(1){width:78vw;height:78vw;background:#1b4fd8;top:-26vw;left:-26vw;animation:d1 42s ease-in-out infinite}
.amb i:nth-child(2){width:56vw;height:56vw;background:#a3202f;bottom:-18vw;right:-20vw;animation:d2 51s ease-in-out infinite}
@keyframes d1{50%{transform:translate3d(8vw,6vw,0) scale(1.12)}}
@keyframes d2{50%{transform:translate3d(-7vw,-5vw,0) scale(1.16)}}
.wrap{position:relative;z-index:1}

.g{position:relative;background:rgba(255,255,255,.052);
  backdrop-filter:blur(30px) saturate(190%);-webkit-backdrop-filter:blur(30px) saturate(190%);
  border:1px solid rgba(255,255,255,.10);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.17),inset 0 -1px 0 rgba(255,255,255,.04),0 14px 38px rgba(0,0,0,.44)}
.g::before{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(148deg,rgba(255,255,255,.14),rgba(255,255,255,0) 46%)}
.g>*{position:relative}

.r-card{border-radius:20px}
.r-pill{border-radius:999px}

.t{-webkit-tap-highlight-color:transparent;cursor:pointer;font:inherit;color:inherit;
  transition:transform .16s cubic-bezier(.2,.8,.3,1),background .2s ease,border-color .2s ease}
.t:active{transform:scale(.965)}
.t:focus-visible{outline:2px solid #6ea4ff;outline-offset:3px}

/* the lap strip: one row, scrolls sideways, never wraps */
.strip{display:flex;gap:7px;overflow-x:auto;overflow-y:hidden;padding:2px 1px 8px;
  scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.chip{scroll-snap-align:center;flex:0 0 auto}
