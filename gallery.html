<!-- site build: v6 dark & bright (Nov 2026) — one page for every gallery: gallery.html?c=portraits -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#0B0B0C"/>
<title>Gallery | Liam Devine Photography | London, Ontario</title>
<meta content="Photography by Liam Devine, London, Ontario. Portrait, family, pet and fine art photography." name="description"/>
<meta content="Liam Devine" name="author"/>
<meta content="Liam Devine Photography" property="og:site_name"/>
<meta content="https://liamdevine.ca/images/portraits/hijab.jpg" property="og:image"/>
<meta content="website" property="og:type"/>
<link href="images/favicon.png" rel="icon"/>
<link href="images/apple-touch-icon.png" rel="apple-touch-icon"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://res.cloudinary.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ===== liamdevine.ca — dark & bright (Nov 2026 refresh) ===== */
:root{
  --ink:#0B0B0C;        /* page ground */
  --ink-2:#141416;      /* raised band */
  --line:#26262A;
  --line-2:#2E2E33;
  --paper:#F2EEE6;      /* main text / bright */
  --muted:#A8A39A;
  --soft:#C9C4BA;
  --gold:#D9A441;       /* accent */
  --wall:#DCDCDA;       /* fine art gallery wall */
  --wall-ink:#1A1918;
  --wall-gold:#6E4C10;
  --serif:'Playfair Display',Georgia,serif;
  --sans:'Jost','Helvetica Neue',Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
html,body{margin:0;padding:0;overflow-x:hidden;background:var(--ink);color:var(--paper);font-family:var(--sans);font-weight:300;font-size:17px;line-height:1.6}
img{max-width:100%}
a{color:var(--paper)}
a:hover{color:var(--gold)}
[hidden]{display:none!important}
.wrap{max-width:1360px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.eyebrow{margin:0;font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold)}
.disp{font-family:var(--serif);font-weight:400}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 28px;text-decoration:none;font-size:12px;letter-spacing:.22em;text-transform:uppercase;font-weight:500;background:var(--paper);color:var(--ink);border:1px solid var(--paper);cursor:pointer;font-family:var(--sans);transition:background .3s,color .3s}
.btn:hover{background:transparent;color:var(--paper)}
.btn.ghost{background:transparent;color:var(--paper);border-color:rgba(242,238,230,.55);font-weight:400}
.btn.ghost:hover{background:var(--paper);color:var(--ink)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,figure:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

/* ---- top bar ---- */
.topbar{position:absolute;top:0;left:0;right:0;z-index:30}
.topbar .wrap{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-block:20px}
.brand{text-decoration:none;display:flex;flex-direction:column;line-height:1.1}
.brand b{font-family:var(--serif);font-weight:400;font-size:23px;letter-spacing:.06em}
.brand small{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--soft)}
.topnav{display:flex;align-items:center;gap:28px;font-size:12px;letter-spacing:.22em;text-transform:uppercase}
.topnav a{text-decoration:none}
.topnav .book{border:1px solid var(--gold);color:var(--gold);padding:0 18px;min-height:44px;display:flex;align-items:center}
.topnav .book:hover{background:var(--gold);color:var(--ink)}
@media(max-width:900px){.topnav .hide-m{display:none}}

/* ---- sticky category bar ---- */
.catbar{position:sticky;top:0;z-index:20;background:rgba(11,11,12,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-block:10px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;text-decoration:none;font-size:12px;letter-spacing:.18em;text-transform:uppercase;padding:0 16px;border:1px solid var(--line-2);border-radius:999px;color:#CFCAC0;min-height:44px;display:flex;align-items:center;white-space:nowrap}
.chip:hover{border-color:var(--gold);color:var(--paper)}
.chip.on{background:var(--paper);color:var(--ink);border-color:var(--paper)}

/* ---- mixed-size mosaic ---- */
.mosaic{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-auto-rows:104px;grid-auto-flow:dense;gap:14px}
.t-big{grid-column:span 6;grid-row:span 6}
.t-tall{grid-column:span 3;grid-row:span 6}
.t-wide{grid-column:span 6;grid-row:span 3}
.t-sq{grid-column:span 3;grid-row:span 3}
.t-txt{grid-column:span 3;grid-row:span 3}
.tile{margin:0;display:flex;flex-direction:column;gap:10px;min-width:0;cursor:pointer}
.tile.t-txt{cursor:default}
.ph{position:relative;overflow:hidden;background:#18181B;flex:1;min-height:0}
.ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 1.2s cubic-bezier(.2,.7,.2,1),opacity .6s}
.ph img.loading{opacity:0}
@media(hover:hover){.tile:hover .ph img{transform:scale(1.06)}}
.hov{position:absolute;inset:auto 0 0 0;padding:48px 16px 14px;background:linear-gradient(transparent,rgba(0,0,0,.82));transform:translateY(101%);transition:transform .6s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.hov .ht{font-family:var(--serif);font-size:22px;line-height:1.2}
.hov .hb{font-size:14px;color:#CFCAC0}
@media(hover:hover){.tile:hover .hov{transform:none}}
@media(hover:none){.hov{transform:none}}
.tile:focus-within .hov,.tile.peek .hov{transform:none}
.above{font-family:var(--serif);font-size:21px;line-height:1.2}
.below{display:flex;justify-content:space-between;gap:12px;font-size:14px;color:#BDB8AE}
.txtile{display:flex;flex-direction:column;justify-content:flex-end;gap:10px;padding:6px 2px;border-top:1px solid var(--gold);flex:1}
.txtile .tt{font-family:var(--serif);font-size:28px;line-height:1.12}
.txtile .tb{color:var(--muted);font-size:15px}
@media(max-width:900px){
  .mosaic{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:80px;gap:10px}
  .t-big{grid-column:span 2;grid-row:span 4}
  .t-tall{grid-column:span 1;grid-row:span 4}
  .t-wide{grid-column:span 2;grid-row:span 2}
  .t-sq,.t-txt{grid-column:span 1;grid-row:span 2}
  .txtile .tt{font-size:22px}
}

/* ---- fine art wall: never cropped ---- */
.wallband{background:var(--wall);color:var(--wall-ink)}
.wallband a{color:var(--wall-ink)}
.wallband .eyebrow{color:var(--wall-gold)}
.wall{column-count:3;column-gap:40px}
.wall .frame{break-inside:avoid;margin:0 0 44px;display:flex;flex-direction:column;gap:14px;cursor:pointer}
.mat{background:#fff;padding:22px;box-shadow:0 1px 0 rgba(0,0,0,.04),0 24px 40px -24px rgba(40,30,10,.45)}
.mat img{width:100%;height:auto;display:block}
.frame figcaption{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.frame .pt{font-family:var(--serif);font-size:20px;font-style:italic}
.frame .pa{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--wall-gold);white-space:nowrap}
@media(max-width:900px){.wall{column-count:2;column-gap:18px}.wall .frame{margin-bottom:26px}.mat{padding:12px}.frame .pt{font-size:16px}}

/* ---- filmstrip (Speed & Motion) ---- */
.strip{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:14px;scrollbar-width:thin;scrollbar-color:var(--gold) #1C1C20}
.strip figure{flex:none;scroll-snap-align:start;width:min(640px,80vw);height:min(420px,54vw);margin:0;cursor:pointer}
@keyframes streak{from{transform:translateX(-120%)}to{transform:translateX(320%)}}
.streak{position:absolute;top:55%;left:0;width:40%;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);animation:streak 2.6s cubic-bezier(.6,0,.2,1) infinite;pointer-events:none}

/* ---- giant outline word behind headings ---- */
.cathead{position:relative;overflow:hidden}
.bigword{position:absolute;left:0;top:0;white-space:nowrap;font-family:var(--serif);font-style:italic;font-size:200px;line-height:1;color:transparent;-webkit-text-stroke:1px rgba(242,238,230,.12);pointer-events:none;user-select:none}
.wallband .bigword{-webkit-text-stroke:1px rgba(26,25,24,.12)}
@media(max-width:900px){.bigword{font-size:120px}}

/* ---- reveals ---- */
@supports (animation-timeline: view()){
  @keyframes reveal{from{clip-path:inset(16% 0 16% 0);transform:translateY(50px) scale(.96);opacity:.2}to{clip-path:inset(0);transform:none;opacity:1}}
  .rv{animation:reveal linear both;animation-timeline:view();animation-range:entry 0% cover 30%}
  @keyframes drift{from{transform:translateX(6%)}to{transform:translateX(-24%)}}
  .bigword{animation:drift linear both;animation-timeline:view()}
}
/* browsers without scroll-timelines: a gentle fade-up when tiles come into view */
@supports not (animation-timeline: view()){
  html.io .rv{opacity:0;transform:translateY(40px);transition:opacity .9s ease,transform 1s cubic-bezier(.2,.8,.2,1)}
  html.io .rv.in{opacity:1;transform:none}
}
@keyframes rise{from{opacity:0;transform:translateY(60%)}to{opacity:1;transform:none}}
.w{display:inline-block;animation:rise 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.late{animation:fadein 1.2s ease .9s both}

.msg{color:var(--muted);font-style:italic;padding:24px 0}

/* ---- lightbox (pinch, swipe, double-tap — same as before) ---- */
.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.94);justify-content:center;align-items:center;z-index:9999;touch-action:none}
.lightbox img{max-width:95vw;max-height:88vh;width:auto!important;height:auto!important;object-fit:contain}
.lb-close{position:absolute;top:max(14px,env(safe-area-inset-top,0px));right:max(18px,env(safe-area-inset-right,0px));color:#fff;font-size:42px;cursor:pointer;z-index:2;background:none;border:0;line-height:1;width:48px;height:48px}
.nav-arrow{position:absolute;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.55);font-size:38px;cursor:pointer;user-select:none;padding:20px;text-shadow:0 2px 8px rgba(0,0,0,.5);background:none;border:0}
.nav-arrow:active{color:rgba(255,255,255,.9)}
.lb-prev{left:6px}.lb-next{right:6px}
.lb-cap{position:absolute;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom,0px));text-align:center;pointer-events:none;padding:0 90px}
.lb-cap .ct{font-family:var(--serif);font-size:20px}
.lb-cap .cb{font-size:14px;color:#CFCAC0}
.lightbox-watermark{position:absolute;bottom:max(22px,env(safe-area-inset-bottom,0px));right:26px;font-size:.8rem;letter-spacing:.03em;color:rgba(255,255,255,.6);pointer-events:none;user-select:none}
.lb-order{display:none;position:absolute;bottom:max(18px,env(safe-area-inset-bottom,0px));left:22px;font-family:var(--sans);font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:#fff;border:1px solid rgba(255,255,255,.65);padding:11px 18px;cursor:pointer;z-index:2;background:rgba(0,0,0,.4);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
@media(max-width:800px){.nav-arrow{font-size:30px;padding:16px}.lb-prev{left:2px}.lb-next{right:2px}.lb-cap{padding:0 20px;bottom:70px}.lightbox-watermark{display:none}}

#backToTop{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:max(18px,env(safe-area-inset-bottom,0px));width:46px;height:46px;border:1px solid var(--line-2);border-radius:999px;cursor:pointer;background:rgba(11,11,12,.8);color:var(--paper);font-size:18px;opacity:0;pointer-events:none;transition:opacity .3s;z-index:25}
#backToTop.show{opacity:1;pointer-events:auto}

footer.foot{border-top:1px solid var(--line)}
footer.foot .wrap{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;padding-block:34px;font-size:13px;color:var(--muted)}
footer.foot b{font-family:var(--serif);font-weight:400;font-size:20px;color:var(--paper)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}


/* ===== gallery page ===== */
.ghdr .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:14px}
.back{text-decoration:none;display:flex;align-items:center;gap:10px;min-height:44px;font-size:12px;letter-spacing:.22em;text-transform:uppercase}
.back span{color:var(--gold);font-size:18px}
.ghdr .brand{align-items:center;text-align:center}
.ghdr .book{text-decoration:none;border:1px solid var(--gold);color:var(--gold);padding:0 16px;min-height:44px;display:flex;align-items:center;font-size:12px;letter-spacing:.22em;text-transform:uppercase}
.ghdr .book:hover{background:var(--gold);color:var(--ink)}
@media(max-width:600px){.ghdr .brand small{display:none}.ghdr .brand b{font-size:19px}}
.gtitle{padding-block:72px 40px}
.gtitle h1{margin:0;font-family:var(--serif);font-weight:400;font-size:clamp(64px,11vw,140px);line-height:.92;overflow:hidden;padding-bottom:.06em}
.gtitle .intro{margin:18px 0 0;max-width:480px;color:var(--muted)}
.gbody{padding-bottom:56px}
.wallband.gbody{padding-top:56px;padding-bottom:40px}
.gtitle.wallband h1{color:var(--wall-ink)}
.gtitle.wallband .intro{color:#4A4946}
.art-ctas{display:flex;gap:12px;flex-wrap:wrap;padding-bottom:72px}
.wallband .btn{background:var(--wall-ink);color:#F2F2F0;border-color:var(--wall-ink)}
.wallband .btn:hover{background:transparent;color:var(--wall-ink)}
.wallband .btn.ghost{background:transparent;color:var(--wall-ink)}
.wallband .btn.ghost:hover{background:var(--wall-ink);color:#F2F2F0}
.next{display:flex;flex-direction:column;gap:8px;text-decoration:none;padding-block:56px;border-top:1px solid var(--line)}
.next .big{font-family:var(--serif);font-size:clamp(40px,6vw,72px);line-height:1}
.next .arr{color:var(--gold);display:inline-block;transition:transform .4s}
.next:hover .arr{transform:translateX(10px)}
.next.small .big{font-size:clamp(30px,4vw,44px)}
</style>
<script>
// GoatCounter: count each gallery as its own page (/gallery/portraits …)
window.goatcounter = {path: function(p){ var c = new URLSearchParams(location.search).get('c'); return c ? '/gallery/' + c.replace(/[^a-z-]/g, '') : p; }};
</script>

<script>
// ===== liamdevine.ca — shared by index.html and gallery.html =====
// Everything the visitor sees comes from Cloudinary and is set in the upload app:
//   • portfolio-config.json — which categories are live, plus text tiles
//   • each photo's tags/context — category, order, tile size, title, caption, blurb
//   • hero-config.json — the hero photos and their framing
// This page only reads. Nothing here can change the site.
const CLOUD_NAME = 'dywzapiql';
const ALL_FOLDERS = ['portraits','family','pets','fine-art','showcase','wildlife','landscapes','street','travel'];
const LABELS = {portraits:'Portraits', family:'Family', pets:'Pets', 'fine-art':'Fine Art', showcase:'Speed & Motion', wildlife:'Wildlife', landscapes:'Landscapes', street:'Street', travel:'Travel'};
const DEFAULT_VIS = {portraits:'site',family:'site',pets:'site','fine-art':'site',showcase:'site',wildlife:'hidden',landscapes:'hidden',street:'hidden',travel:'hidden'};
const SIZES = ['big','tall','wide','sq'];
// Used when a photo has no size chosen in the app — keeps every gallery looking composed
// Built from blocks that fit together edge to edge: big+tall+tall · wide+sq+sq · sq+sq+wide · tall+big+tall · wide+wide
const AUTO_SIZES = ['big','tall','tall','wide','sq','sq','sq','sq','wide','tall','big','tall','wide','wide'];

const $ = (s, el) => (el || document).querySelector(s);
function el(tag, cls, text){ const e = document.createElement(tag); if(cls) e.className = cls; if(text != null) e.textContent = text; return e; }
function dec(v){ if(!v) return ''; try{ return decodeURIComponent(v); }catch(e){ return String(v); } }
function galleryHref(folder){ return 'gallery.html?c=' + encodeURIComponent(folder); }

function humanName(name){
  const w = String(name || '').replace(/[-_]+/g, ' ').trim();
  return w.charAt(0).toUpperCase() + w.slice(1);
}
function imgUrl(p, w){
  return `https://res.cloudinary.com/${CLOUD_NAME}/image/upload/f_auto,q_auto,w_${w}/v${p.version}/${p.public_id}.${p.format}`;
}

// ---- site settings (live categories + text tiles) ----
async function loadSiteConfig(){
  const out = {vis: Object.assign({}, DEFAULT_VIS), texts: {}};
  try{
    const res = await fetch(`https://res.cloudinary.com/${CLOUD_NAME}/raw/upload/portfolio-config.json?v=${Date.now()}`, {cache:'no-store'});
    if(!res.ok) throw new Error('no config');
    const cfg = await res.json();
    (cfg.categories || []).forEach(c => { if(c.folder in out.vis) out.vis[c.folder] = c.visibility; });
    if(cfg.texts && typeof cfg.texts === 'object') out.texts = cfg.texts;
  }catch(e){ /* defaults stand */ }
  return out;
}
function liveFolders(vis){ return ALL_FOLDERS.filter(f => vis[f] === 'site'); }

// ---- one category's photos, in the order set in the app ----
async function loadPhotos(folder){
  const res = await fetch(`https://res.cloudinary.com/${CLOUD_NAME}/image/list/${folder}.json?v=${Date.now()}`);
  if(res.status === 404) return [];
  if(!res.ok) throw new Error('Cloudinary list error ' + res.status);
  const data = await res.json();
  const ctxOf = r => (r.context && (r.context.custom || r.context)) || {};
  const ordOf = r => { const n = parseInt(ctxOf(r).order, 10); return isNaN(n) ? Infinity : n; };
  return (data.resources || [])
    .sort((a, b) => (ordOf(a) - ordOf(b)) || a.public_id.localeCompare(b.public_id))
    .map(r => {
      const c = ctxOf(r);
      const sh = String(c.sh || '');
      const name = r.public_id.split('/').pop();
      const title = dec(c.t).trim(), caption = dec(c.c).trim(), blurb = dec(c.b).trim();
      return {
        folder, public_id: r.public_id, version: r.version, format: r.format,
        w: r.width || 0, h: r.height || 0, name,
        size: SIZES.includes(c.size) ? c.size : '',
        title, caption, blurb,
        showTitle: sh.includes('t') && !!title,
        showCaption: sh.includes('c') && !!(caption || title),
        showBlurb: sh.includes('b') && !!(blurb || title),
        alt: (title || humanName(name)) + ' — Liam Devine Photography'
      };
    });
}

// ---- tiles ----
function makeImg(p, w, eager){
  const img = el('img', 'loading');
  img.alt = p.alt;
  img.decoding = 'async';
  img.loading = eager ? 'eager' : 'lazy';
  if(p.w && p.h){ img.width = p.w; img.height = p.h; }
  img.onload = () => img.classList.remove('loading');
  img.onerror = () => img.classList.remove('loading');
  img.src = imgUrl(p, w);
  return img;
}

// photos: list; texts: text tiles [{title, blurb, after, on}]
// opts: {limit, sizes (forced pattern), onOpen(list, index)}
function renderMosaic(box, photos, texts, opts){
  opts = opts || {};
  box.innerHTML = '';
  const list = opts.limit ? photos.slice(0, opts.limit) : photos;
  const tx = (texts || []).filter(t => t && t.on !== false && (t.title || t.blurb));
  const textsAt = n => tx.filter(t => Math.max(0, Math.min(list.length, parseInt(t.after, 10) || 0)) === n);
  const addTexts = n => textsAt(n).forEach(t => {
    const d = el('div', 'tile t-txt rv');
    const inner = el('div', 'txtile');
    if(t.title) inner.appendChild(el('span', 'tt', t.title));
    if(t.blurb) inner.appendChild(el('span', 'tb', t.blurb));
    d.appendChild(inner);
    box.appendChild(d);
  });
  list.forEach((p, i) => {
    if(!opts.sizes) addTexts(i);
    const size = opts.sizes ? opts.sizes[i % opts.sizes.length] : (p.size || AUTO_SIZES[i % AUTO_SIZES.length]);
    const fig = el('figure', 'tile rv t-' + size);
    fig.tabIndex = 0;
    fig.setAttribute('role', 'button');
    fig.setAttribute('aria-label', 'Open ' + (p.title || humanName(p.name)));
    if(!opts.sizes && p.showTitle) fig.appendChild(el('div', 'above', p.title));
    const ph = el('div', 'ph');
    ph.appendChild(makeImg(p, size === 'big' || size === 'wide' ? 1600 : 1000, i < 2 && opts.eager));
    if(!opts.sizes && p.showBlurb){
      const h = el('div', 'hov');
      if(p.title) h.appendChild(el('div', 'ht', p.title));
      if(p.blurb) h.appendChild(el('div', 'hb', p.blurb));
      ph.appendChild(h);
    }
    fig.appendChild(ph);
    if(!opts.sizes && p.showCaption){
      const cap = el('figcaption', 'below');
      cap.appendChild(el('span', '', p.caption || p.title));
      fig.appendChild(cap);
    }
    const open = () => opts.onOpen && opts.onOpen(photos, photos.indexOf(p));
    fig.addEventListener('click', open);
    fig.addEventListener('keydown', e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); open(); } });
    box.appendChild(fig);
  });
  if(!opts.sizes) addTexts(list.length);
  watchReveals(box);
}

// ---- scroll reveals for browsers without CSS scroll-timelines ----
let revealIO = null;
if(!(window.CSS && CSS.supports && CSS.supports('animation-timeline: view()')) && 'IntersectionObserver' in window){
  document.documentElement.classList.add('io');
  revealIO = new IntersectionObserver(es => es.forEach(e => {
    if(e.isIntersecting){ e.target.classList.add('in'); revealIO.unobserve(e.target); }
  }), {rootMargin:'0px 0px -8% 0px', threshold:0.05});
}
function watchReveals(root){
  if(!revealIO) return;
  (root || document).querySelectorAll('.rv:not(.in)').forEach(n => revealIO.observe(n));
}

// ---- category chips ----
function renderChips(box, folders, current){
  box.innerHTML = '';
  folders.forEach(f => {
    const a = el('a', 'chip' + (f === current ? ' on' : ''), LABELS[f]);
    a.href = galleryHref(f);
    if(f === current) a.setAttribute('aria-current', 'page');
    box.appendChild(a);
  });
  const on = box.querySelector('.on');
  if(on) box.scrollLeft = on.offsetLeft - 20;
}

// ---- back to top ----
(function(){
  const b = document.getElementById('backToTop');
  if(!b) return;
  window.addEventListener('scroll', () => b.classList.toggle('show', window.scrollY > 900), {passive:true});
  b.addEventListener('click', () => window.scrollTo({top:0, behavior:'smooth'}));
})();

// ===== LIGHTBOX =====
// Same gestures as before: pinch to zoom, pan when zoomed, swipe left/right,
// swipe down or tap to close, double-tap to zoom. The page stays put underneath.
const LB = {list:[], index:0, savedY:0, onOrder:null};
const lb = document.getElementById('lightbox');
const lbImg = document.getElementById('lightbox-img');

function lbShow(){
  const p = LB.list[LB.index];
  if(!p) return;
  lbImg.src = imgUrl(p, 2000);
  lbImg.alt = p.alt;
  const cap = document.getElementById('lbCap');
  cap.innerHTML = '';
  const t = p.title, c = p.caption || '';
  if(t) cap.appendChild(el('div', 'ct', t));
  if(c && c !== t) cap.appendChild(el('div', 'cb', c));
  else if(p.blurb && p.showBlurb) cap.appendChild(el('div', 'cb', p.blurb));
  document.getElementById('lbOrder').style.display = (p.folder === 'fine-art' && LB.onOrder) ? 'block' : 'none';
  [1, -1].forEach(d => {
    if(LB.list.length < 2) return;
    const n = LB.list[(LB.index + d + LB.list.length) % LB.list.length];
    const im = new Image(); im.src = imgUrl(n, 2000);
  });
}
function openLightbox(list, index, onOrder){
  if(!list || !list.length) return;
  resetZoom();
  LB.list = list; LB.index = Math.max(0, index); LB.onOrder = onOrder || null;
  LB.savedY = window.scrollY;
  document.body.style.position = 'fixed';
  document.body.style.top = -LB.savedY + 'px';
  document.body.style.width = '100%';
  lb.style.display = 'flex';
  lbShow();
  history.pushState({ldLightbox:true}, '');
}
function closeLightbox(){
  if(history.state && history.state.ldLightbox){ history.back(); }
  else { actuallyCloseLightbox(); }
}
function actuallyCloseLightbox(){
  resetZoom();
  const html = document.documentElement;
  html.style.scrollBehavior = 'auto';
  document.body.style.position = '';
  document.body.style.top = '';
  document.body.style.width = '';
  window.scrollTo({top: LB.savedY, left: 0, behavior: 'auto'});
  requestAnimationFrame(() => { lb.style.display = 'none'; html.style.scrollBehavior = ''; });
}
window.addEventListener('popstate', () => { if(lb.style.display === 'flex') actuallyCloseLightbox(); });
function nextImage(){ resetZoom(); LB.index = (LB.index + 1) % LB.list.length; lbShow(); }
function prevImage(){ resetZoom(); LB.index = (LB.index - 1 + LB.list.length) % LB.list.length; lbShow(); }
function orderFromLightbox(){
  const p = LB.list[LB.index];
  const go = LB.onOrder;
  closeLightbox();
  if(go) setTimeout(() => go(p), 240);
}
document.addEventListener('keydown', e => {
  if(lb.style.display !== 'flex') return;
  if(e.key === 'ArrowRight') nextImage();
  if(e.key === 'ArrowLeft') prevImage();
  if(e.key === 'Escape') closeLightbox();
});

const ZOOM_MAX = 4;
let zScale = 1, zX = 0, zY = 0, gesture = null, lastTapT = 0, lastTouchT = 0, tapTimer = null;
const isZoomed = () => zScale > 1.01;
const tDist = (a, b) => Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
const tMid = (a, b) => ({x:(a.clientX + b.clientX) / 2, y:(a.clientY + b.clientY) / 2});
function applyZoom(animate){ lbImg.style.transition = animate ? 'transform .25s ease' : 'none'; lbImg.style.transform = `translate(${zX}px, ${zY}px) scale(${zScale})`; }
function clampPan(){
  const w = lbImg.offsetWidth * zScale, h = lbImg.offsetHeight * zScale;
  const mx = Math.max(0, (w - window.innerWidth) / 2), my = Math.max(0, (h - window.innerHeight) / 2);
  zX = Math.min(mx, Math.max(-mx, zX)); zY = Math.min(my, Math.max(-my, zY));
}
function resetZoom(){ zScale = 1; zX = 0; zY = 0; lbImg.style.transition = ''; lbImg.style.transform = ''; }
function resetZoomAnimated(){
  zScale = 1; zX = 0; zY = 0;
  lbImg.style.transition = 'transform .25s ease'; lbImg.style.transform = 'translate(0px, 0px) scale(1)';
  setTimeout(() => { lbImg.style.transition = ''; lbImg.style.transform = ''; }, 260);
}
function tapClose(){
  lbImg.style.transition = 'transform .2s ease, opacity .2s ease';
  lbImg.style.transform = 'scale(0.85)'; lbImg.style.opacity = '0';
  setTimeout(() => { closeLightbox(); lbImg.style.transition = ''; lbImg.style.transform = ''; lbImg.style.opacity = ''; }, 180);
}
const isControl = t => t.closest && t.closest('.nav-arrow, .lb-close, .lb-order');
['gesturestart','gesturechange','gestureend'].forEach(ev => lb.addEventListener(ev, e => e.preventDefault()));
lb.addEventListener('touchstart', e => {
  lastTouchT = Date.now();
  if(isControl(e.target)) return;
  if(e.touches.length === 2){
    clearTimeout(tapTimer); lbImg.style.opacity = ''; lb.style.background = '';
    gesture = {type:'pinch', d0:tDist(e.touches[0], e.touches[1]), m0:tMid(e.touches[0], e.touches[1]), s0:zScale, x0:zX, y0:zY};
    lbImg.style.transition = 'none'; e.preventDefault();
  } else if(e.touches.length === 1){
    const t = e.touches[0];
    gesture = isZoomed()
      ? {type:'pan', sx:t.clientX, sy:t.clientY, x0:zX, y0:zY, moved:false, t0:Date.now()}
      : {type:'swipe', sx:t.clientX, sy:t.clientY, drag:false, t0:Date.now()};
  }
}, {passive:false});
lb.addEventListener('touchmove', e => {
  if(!gesture) return;
  if(gesture.type === 'pinch' && e.touches.length >= 2){
    e.preventDefault();
    const d = tDist(e.touches[0], e.touches[1]), m = tMid(e.touches[0], e.touches[1]);
    const s = Math.min(ZOOM_MAX, Math.max(1, gesture.s0 * d / gesture.d0));
    const cx = m.x - window.innerWidth / 2, cy = m.y - window.innerHeight / 2;
    const c0x = gesture.m0.x - window.innerWidth / 2, c0y = gesture.m0.y - window.innerHeight / 2;
    zX = cx - (c0x - gesture.x0) * (s / gesture.s0); zY = cy - (c0y - gesture.y0) * (s / gesture.s0);
    zScale = s; clampPan(); applyZoom(false); return;
  }
  if(gesture.type === 'pan' && e.touches.length === 1){
    e.preventDefault();
    const t = e.touches[0];
    zX = gesture.x0 + (t.clientX - gesture.sx); zY = gesture.y0 + (t.clientY - gesture.sy);
    if(Math.abs(t.clientX - gesture.sx) > 6 || Math.abs(t.clientY - gesture.sy) > 6) gesture.moved = true;
    clampPan(); applyZoom(false); return;
  }
  if(gesture.type === 'swipe' && e.touches.length === 1){
    const t = e.touches[0], dX = t.clientX - gesture.sx, dY = t.clientY - gesture.sy;
    if(Math.abs(dY) > Math.abs(dX) && dY > 10){
      gesture.drag = true; e.preventDefault();
      const pr = Math.min(dY / 160, 1);
      lbImg.style.transition = 'none';
      lbImg.style.transform = `translateY(${dY}px) scale(${1 - pr * 0.3})`;
      lbImg.style.opacity = `${1 - pr * 0.6}`;
      lb.style.background = `rgba(0,0,0,${0.94 - pr * 0.6})`;
    }
  }
}, {passive:false});
lb.addEventListener('touchend', e => {
  if(isControl(e.target)){ gesture = null; return; }
  if(!gesture) return;
  const g = gesture;
  if(g.type === 'pinch'){
    if(e.touches.length >= 2) return;
    if(e.touches.length === 1){
      if(zScale <= 1.02){ resetZoomAnimated(); gesture = null; return; }
      const t = e.touches[0];
      gesture = {type:'pan', sx:t.clientX, sy:t.clientY, x0:zX, y0:zY, moved:true, t0:Date.now()};
      return;
    }
    if(zScale <= 1.02) resetZoomAnimated(); else { clampPan(); applyZoom(true); }
    gesture = null; return;
  }
  if(g.type === 'pan'){
    if(e.touches.length > 0) return;
    if(!g.moved && Date.now() - g.t0 < 250){
      e.preventDefault();
      const now = Date.now();
      if(now - lastTapT < 320){ lastTapT = 0; resetZoomAnimated(); } else { lastTapT = now; }
    } else { clampPan(); applyZoom(true); }
    gesture = null; return;
  }
  const t = e.changedTouches[0], dX = t.clientX - g.sx, dY = t.clientY - g.sy, dur = Date.now() - g.t0;
  gesture = null;
  if(g.drag){
    lbImg.style.transition = 'transform .25s ease, opacity .25s ease';
    lb.style.transition = 'background .25s ease';
    if(dY > 55){
      lbImg.style.transform = 'translateY(300px) scale(0.7)'; lbImg.style.opacity = '0';
      setTimeout(() => { closeLightbox(); lbImg.style.transition = ''; lbImg.style.transform = ''; lbImg.style.opacity = ''; lb.style.background = ''; lb.style.transition = ''; }, 220);
    } else { lbImg.style.transform = ''; lbImg.style.opacity = ''; lb.style.background = ''; }
    return;
  }
  if(Math.abs(dX) < 10 && Math.abs(dY) < 10 && dur < 250 && e.target === lbImg){
    e.preventDefault();
    const now = Date.now();
    if(now - lastTapT < 320){
      lastTapT = 0; clearTimeout(tapTimer);
      zScale = 2.5;
      zX = -(t.clientX - window.innerWidth / 2) * (zScale - 1);
      zY = -(t.clientY - window.innerHeight / 2) * (zScale - 1);
      clampPan(); applyZoom(true);
    } else { lastTapT = now; clearTimeout(tapTimer); tapTimer = setTimeout(tapClose, 300); }
    return;
  }
  if(dX < -50) nextImage();
  if(dX > 50) prevImage();
}, {passive:false});
lb.addEventListener('click', e => { if(e.target === lb) closeLightbox(); });
lbImg.addEventListener('click', () => { if(Date.now() - lastTouchT < 600) return; tapClose(); });
// iOS: don't spend the first tap on a hover state
document.addEventListener('touchstart', function(){}, true);


// ===== GALLERY PAGE =====
const INTROS = {
  portraits: 'Natural light, honest expression. Headshots from $245, portrait sessions from $315.',
  family: 'Real families, real moments, all ages. Family sessions from $425.',
  pets: 'Dogs, cats and horses, photographed being themselves. Pet sessions from $335.',
  'fine-art': 'Archival prints on fine art paper, canvas or framed, from 8×10 to large format. Often one of one. Shipped across Canada.',
  showcase: 'Motorsport, air shows and anything else that moves fast.',
  wildlife: 'Animals in their own world.',
  landscapes: 'Places worth stopping for.',
  street: 'Everyday life, as it happens.',
  travel: 'Notes from the road.'
};
const BOOK = {portraits:'Book a portrait session', family:'Book a family session', pets:'Book a pet session', 'fine-art':'Order a print'};

function printLink(p){ return './?print=' + encodeURIComponent(p ? (p.title || humanName(p.name)) : '') + '#contact'; }

(async function(){
  const want = (new URLSearchParams(location.search).get('c') || '').toLowerCase();
  const site = await loadSiteConfig();
  const live = liveFolders(site.vis);
  const folder = live.includes(want) ? want : null;
  renderChips(document.getElementById('chips'), live, folder);
  const grid = document.getElementById('gGrid');
  if(!folder){
    document.getElementById('gName').textContent = 'Galleries';
    document.getElementById('gIntro').textContent = 'That gallery isn’t on the site right now. Pick one above.';
    grid.innerHTML = '';
    return;
  }
  const label = LABELS[folder];
  document.title = label + ' | Liam Devine Photography | London, Ontario';
  const md = document.querySelector('meta[name="description"]');
  if(md) md.setAttribute('content', label + ' by Liam Devine, photographer in London, Ontario. ' + INTROS[folder]);
  document.getElementById('gName').textContent = label;
  document.getElementById('gGhost').textContent = label + ' · ' + label;
  document.getElementById('gIntro').textContent = INTROS[folder] || '';

  const i = live.indexOf(folder);
  if(live.length > 1){
    const nx = live[(i + 1) % live.length];
    const a = document.getElementById('nextLink');
    a.href = galleryHref(nx); a.hidden = false;
    document.getElementById('nextName').textContent = LABELS[nx];
  }
  const bookText = BOOK[folder] || 'Book a session';
  document.getElementById('bookText').textContent = bookText;
  document.getElementById('bookLink').href = folder === 'fine-art' ? printLink(null) : './?book=' + encodeURIComponent(label) + '#contact';

  let photos;
  try{ photos = await loadPhotos(folder); }
  catch(e){ grid.innerHTML = '<p class="msg">Photos could not be loaded right now. Please try again in a moment.</p>'; return; }
  const n = photos.length;
  document.getElementById('gCount').textContent = 'Gallery · ' + n + (n === 1 ? ' photo' : ' photos');
  if(!n){ grid.innerHTML = '<p class="msg">No photos here yet.</p>'; return; }

  if(folder === 'fine-art'){
    // the whole page section turns into the gray gallery wall
    document.getElementById('gHead').classList.add('wallband');
    const body = document.getElementById('gBody');
    body.classList.add('wallband');
    document.getElementById('gHead').style.marginBottom = '0';
    grid.className = 'wall';
    renderWall(grid, photos, {onOpen: (list, k) => openLightbox(list, k, p => { location.href = printLink(p); })});
    const ctas = el('div', 'art-ctas');
    const o = el('a', 'btn', 'Order a print'); o.href = printLink(null);
    const q = el('a', 'btn ghost', 'Ask a question'); q.href = './?book=' + encodeURIComponent('Fine Art question') + '#contact';
    ctas.appendChild(o); ctas.appendChild(q);
    grid.parentNode.appendChild(ctas);
  } else {
    grid.className = 'mosaic';
    const texts = Array.isArray(site.texts[folder]) ? site.texts[folder] : [];
    renderMosaic(grid, photos, texts, {onOpen: (list, k) => openLightbox(list, k), eager: true});
  }
})();
