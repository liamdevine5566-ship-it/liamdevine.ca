<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MQ Finder">
<meta name="theme-color" content="#DC143C">
<title>MQ Equipment Finder</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F2F2F4;color:#1a1a1a;padding-bottom:env(safe-area-inset-bottom)}
.hdr{background:#fff;border-bottom:1px solid #E2E2E6;padding:14px 16px calc(14px) 16px;padding-top:calc(14px + env(safe-area-inset-top));position:sticky;top:0;z-index:50}
.hdr h1{font-size:17px;font-weight:600;letter-spacing:-.2px}
.hdr h1 span{color:#DC143C}
.wrap{max-width:640px;margin:0 auto;padding:14px 16px 340px}
.sbox{position:relative;margin-bottom:10px}
.sbox input{width:100%;padding:14px;font-size:16px;border:1.5px solid #DDD;border-radius:11px;font-family:inherit;background:#fff}
.sbox input:focus{outline:none;border-color:#DC143C}
.clr{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;background:#C9C9CE;color:#fff;border:none;font-size:15px;line-height:1;cursor:pointer;display:none}
.clr.on{display:block}
.sug{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1px solid #DDD;border-radius:11px;max-height:340px;overflow-y:auto;-webkit-overflow-scrolling:touch;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.sug.hide{display:none}
.sug-i{padding:11px 13px;border-bottom:1px solid #F0F0F2;cursor:pointer}
.sug-i:last-child{border-bottom:none}
.sug-i:active{background:#F5F5F7}
.sug-m{font-weight:600;color:#DC143C;font-size:14px}
.sug-d{font-size:12px;color:#7A7A80;margin-top:2px}
.sug-p{font-size:12px;color:#1a1a1a;font-weight:600;float:right}
.row{display:flex;gap:8px;margin-bottom:14px}
.disc{flex:1;display:flex;align-items:center;gap:9px;background:#fff;border:1px solid #E2E2E6;border-radius:11px;padding:11px 13px}
.disc label{font-size:13px;color:#6A6A70;font-weight:500;white-space:nowrap}
.disc input{width:100%;border:none;font-size:16px;font-family:inherit;font-weight:600;background:transparent}
.disc input:focus{outline:none}
.cat{display:flex;gap:7px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.cat::-webkit-scrollbar{display:none}
.cat button{flex-shrink:0;padding:8px 13px;background:#fff;border:1px solid #E2E2E6;border-radius:100px;font-size:13px;font-family:inherit;font-weight:500;color:#3a3a3e;cursor:pointer}
.cat button:active{background:#DC143C;color:#fff;border-color:#DC143C}
.hint{font-size:12px;color:#8A8A90;margin-bottom:9px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.card{background:#fff;border:1px solid #E2E2E6;border-radius:12px;padding:14px;margin-bottom:8px;cursor:pointer}
.card:active{background:#FAFAFA}
.card-m{font-weight:700;color:#DC143C;font-size:15px}
.card-d{font-size:13px;color:#5A5A60;margin-top:3px;line-height:1.35}
.card-p{font-size:14px;font-weight:600;margin-top:7px}
.hero{background:#fff;border:1px solid #E2E2E6;border-radius:12px;padding:16px;margin-bottom:16px}
.hero-m{font-size:21px;font-weight:700;letter-spacing:-.4px}
.hero-d{font-size:14px;color:#5A5A60;margin-top:4px;line-height:1.4}
.hero-p{margin-top:12px;padding-top:12px;border-top:1px solid #EFEFF1;display:flex;justify-content:space-between;align-items:flex-end}
.pl{font-size:11px;color:#8A8A90;text-transform:uppercase;letter-spacing:.4px;font-weight:600}
.pv{font-size:20px;font-weight:700;margin-top:2px}
.pv.was{font-size:15px;color:#9A9AA0;text-decoration:line-through;font-weight:500}
.red{color:#DC143C}
.back{background:none;border:none;color:#DC143C;font-size:15px;font-weight:600;font-family:inherit;padding:4px 0 12px;cursor:pointer}
.acc{background:#fff;border:1px solid #E2E2E6;border-radius:11px;padding:13px;margin-bottom:7px;display:flex;align-items:center;gap:12px;cursor:pointer}
.acc:active{background:#FAFAFA}
.acc.on{border-color:#DC143C;border-width:2px;padding:12px}
.tick{width:25px;height:25px;border-radius:50%;border:1.5px solid #C9C9CE;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;color:transparent;font-weight:700}
.acc.on .tick{background:#DC143C;border-color:#DC143C;color:#fff}
.acc-i{flex:1;min-width:0}
.acc-m{font-size:13px;font-weight:700}
.acc-d{font-size:12px;color:#6A6A70;margin-top:2px;line-height:1.3}
.acc-p{text-align:right;flex-shrink:0;font-size:14px;font-weight:700}
.acc-p small{display:block;font-size:11px;color:#9A9AA0;text-decoration:line-through;font-weight:500}
.grp{font-size:11px;font-weight:700;color:#8A8A90;text-transform:uppercase;letter-spacing:.5px;margin:16px 0 8px}
.empty{background:#fff;border:1px solid #E2E2E6;border-radius:12px;padding:26px 16px;text-align:center;color:#8A8A90;font-size:14px}
.quote{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #DDD;box-shadow:0 -4px 20px rgba(0,0,0,.09);z-index:70;max-height:62vh;display:flex;flex-direction:column}
.q-bar{padding:12px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;flex-shrink:0}
.q-bar .lbl{flex:1;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:#5A5A60}
.q-bar .tot{font-size:19px;font-weight:700;color:#DC143C}
.q-bar .chev{color:#9A9AA0;font-size:12px;width:14px;text-align:center}
.q-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px;max-width:640px;margin:0 auto;width:100%}
.quote.shut .q-body,.quote.shut .q-foot{display:none}
.q-line{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid #F0F0F2;font-size:13px}
.q-line .n{flex:1;min-width:0}
.q-line .nm{font-weight:700}
.q-line .ds{font-size:11px;color:#8A8A90;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q-line .pr{font-weight:700;flex-shrink:0}
.q-line .x{color:#C9C9CE;font-size:19px;padding:0 2px;cursor:pointer;flex-shrink:0}
.q-foot{padding:12px 16px calc(14px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto;width:100%;flex-shrink:0}
.q-sum{display:flex;justify-content:space-between;font-size:13px;color:#6A6A70;padding:3px 0}
.q-sum.big{font-size:16px;font-weight:700;color:#1a1a1a;border-top:1px solid #E2E2E6;margin-top:7px;padding-top:9px}
.q-btn{width:100%;padding:12px;background:#F2F2F4;border:none;border-radius:10px;font-size:14px;font-weight:600;font-family:inherit;color:#3a3a3e;cursor:pointer;margin-top:9px}
.q-none{padding:16px 0 20px;text-align:center;color:#9A9AA0;font-size:13px}
</style>
</head>

<div class="hdr"><h1>MQ <span>Equipment Finder</span></h1></div>

<div class="wrap">
  <div class="sbox">
    <input id="q" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Model, or &quot;25 kVA&quot;, &quot;ride on trowel&quot;...">
    <button class="clr" id="clr">&times;</button>
    <div class="sug hide" id="sug"></div>
  </div>

  <div class="row">
    <div class="disc"><label>Machine</label><input id="dm" type="number" inputmode="decimal" placeholder="0" min="0" max="100"><label>%</label></div>
    <div class="disc"><label>Parts</label><input id="dp" type="number" inputmode="decimal" placeholder="0" min="0" max="100"><label>%</label></div>
  </div>

  <div class="cat" id="cat"></div>
  <div id="out"></div>
</div>

<div class="quote shut" id="quote">
  <div class="q-bar" id="qbar">
    <span class="chev" id="chev">&#9650;</span>
    <span class="lbl">Quote <span id="qn"></span></span>
    <span class="tot" id="qtot">$0.00</span>
  </div>
  <div class="q-body" id="qbody"></div>
  <div class="q-foot" id="qfoot"></div>
</div>

function famFor(q){
  const s = q.toLowerCase().trim();
  let best=null,len=0;
  for(const f of FAM) for(const k of f.k)

}

    let s=0;
    if(m===Q) s=1000;
    else if(m.startsWith(Q)) s=620;
    else if(m.includes(Q)) s=430;
    else if(d.includes(Q)) s=260;
    else if(toks.length>1&&toks.every(t=>hay.includes(t))) s=140;
    if(s){ if(isMachine(p)) s+=55; out.push({p,s}); }
  }
  return out.sort((a,b)=>b.s-a.s||a.p.m.localeCompare(b.p.m,undefined,{numeric:true})).map(o=>o.p);
}

/* accessories.
   Two kinds, because the catalog only sometimes names the parent model:
   1. exact  - description names this model (e.g. "Filter Kit DCA-25SSIU2")
   2. by type - description is generic (vibrator shafts, trowel blades), so match on family */
function accsFor(prod){
  const M=nz(prod.m);
  const base=(prod.m.match(/^[A-Za-z]+\d+/)||[prod.m])[0];
  const B=nz(base);
  const sortM=(a,b)=>a.m.localeCompare(b.m,undefined,{numeric:true});

  const exact=P.filter(p=>{
    if(nz(p.m)===M) return false;
    const d=nz(p.d);
    return d.includes(M)||(B.length>=4&&d.includes(B));
  }).sort(sortM);

  let hitches=[];
  if(/^(WM|EM|MC)/i.test(prod.m)&&/Mixer/i.test(prod.d)) hitches=HITCH.mixer;
  else if(/^(DCA|NGA|TLG)/i.test(prod.m)&&/^Gen\b/i.test(prod.d)) hitches=HITCH.gen;

  /* groups are built in order; each part lands in the first group it fits */
  const taken=new Set(exact.map(p=>p.m)); taken.add(prod.m);
  const groups=[];
  const G=(label,f)=>{
    const items=P.filter(p=>!taken.has(p.m)&&f(p)).sort(sortM);
    items.forEach(p=>taken.add(p.m));
    if(items.length) groups.push({label,items});
  };

  const wbt=/^TROWEL\s+(\d+)/i.exec(prod.d);
  const rot=/^ROT\s+\d/i.test(prod.d);

  if(/^(CV|G55|BPX)/i.test(prod.m)){
    G('Shafts &amp; heads &mdash; pick to suit the pour',
      p=>/^FSN?\d/i.test(p.m)||/^FSC$/i.test(p.m)||/Vibrator Head/i.test(p.d));
  }
  else if(wbt||rot){
    const sz = wbt ? wbt[1] : null;
    /* a part is tagged ROT (ride-on) and/or TROWEL/WBT (walk-behind). untagged = fits both */
    const fits = d => {
      const isROT=/\bROT\b/i.test(d), isWBT=/TROWEL|\bWBT\b/i.test(d);
      if(!isROT&&!isWBT) return true;
      return rot ? isROT : isWBT;
    };
    /* blade dimensions imply a machine size when the size isn't spelled out */
    const DIM={'9.2':['24'],'9.25':['24'],'10.5':['30'],'14':['36'],'16':['48'],'18':['46','48'],'23':['60']};
    /* if a part states (or implies) machine sizes, one of them has to be ours */
    const szOK = d => {
      if(!sz) return true;
      let found=(d.match(/\b(24|30|36|46|48|60|70)\b/g)||[]);
      if(!found.length){
        const dim=/(\d+(?:\.\d+)?)\s*[xX]\s*(\d+(?:\.\d+)?)/.exec(d);
        if(dim&&DIM[dim[2]]) found=DIM[dim[2]];
      }
      return !found.length || found.includes(sz);
    };
    const lbl = sz ? sz+'&Prime; walk-behind' : 'ride-on &mdash; check size';
    G('Finish blades &mdash; '+lbl,
      p=>/\bBLADE\b/i.test(p.d)&&!/PAN/i.test(p.d)&&!/DUOSCREED|SNOW|TUFFTRUK|PLOUGH/i.test(p.d)&&fits(p.d)&&szOK(p.d));
    G('Float pans &mdash; '+lbl,
      p=>/PAN FLOAT/i.test(p.d)&&fits(p.d)&&szOK(p.d));
    if(!rot) G('Handles',
      p=>/HANDLE TROWEL/i.test(p.d)&&!(/CA4HC/i.test(p.d)&&!/^CA4/i.test(prod.m)));
    G('Arms, pins &amp; service',
      p=>/TROWEL ARM|LATCH PIN|CLEVIS PIN|SNAP PIN|LOW SPEED KIT|SERVICE KIT|DISASSEMBLY/i.test(p.d)&&fits(p.d)&&szOK(p.d));
  }

  return {exact,hitches,groups};
}

/* ---------------- state ---------------- */
let results=[], current=null, cart=[], shut=true;
const $=id=>document.getElementById(id);
const rate=id=>{const v=parseFloat($(id).value); return isNaN(v)||v<0?0:Math.min(v,100);};
const dM=()=>rate('dm');            /* machine discount */
const dP=()=>rate('dp');            /* parts / accessory discount */
const rateFor=k=>k==='m'?dM():dP();
const net=(b,k)=>b*(1-rateFor(k)/100);
const inCart=m=>cart.some(l=>l.m===m);

/* ---------------- render ---------------- */
function chips(){
  $('cat').innerHTML=CHIPS.map(c=>`<button onclick="go('${c}')">${c}</button>`).join('');
}

function suggest(){
  const v=$('q').value;
  $('clr').classList.toggle('on',!!v);
  if(v.trim().length<2){$('sug').classList.add('hide');return;}
  const r=search(v);
  if(!r.length){$('sug').classList.add('hide');return;}
  $('sug').innerHTML=r.map((p,i)=>
    `<div class="sug-i" onclick="pick(${P.indexOf(p)})"><span class="sug-p">${money(p.p)}</span>
     <div class="sug-m">${esc(p.m)}</div><div class="sug-d">${esc(p.d)}</div></div>`).join('');
  $('sug').classList.remove('hide');
}

function go(q){
  $('q').value=q; $('clr').classList.add('on'); $('sug').classList.add('hide');
  $('dm').value=''; $('dp').value=''; current=null;
  results=search(q);
  if(!results.length){$('out').innerHTML='<div class="empty">Nothing matched that.<br>Try a model number, or tap a category above.</div>';return;}
  if(results.length===1){detail(results[0]);return;}
  list();
}

function list(){
  current=null;
  const mach=results.filter(isMachine), part=results.filter(p=>!isMachine(p));
  const card=p=>`<div class="card" onclick="openProd(${P.indexOf(p)})">
      <div class="card-m">${esc(p.m)}</div><div class="card-d">${esc(p.d)}</div>
      <div class="card-p">${money(p.p)}</div></div>`;
  let h=`<div class="hint">${results.length} result${results.length>1?'s':''} &mdash; tap one</div>`;
  if(mach.length&&part.length){
    h+=`<div class="grp" style="margin-top:0">Machines (${mach.length})</div>`+mach.map(card).join('');
    h+=`<div class="grp">Parts &amp; accessories (${part.length})</div>`+part.map(card).join('');
  } else h+=results.map(card).join('');
  $('out').innerHTML=h;
  window.scrollTo(0,0);
}

function pick(i){ $('sug').classList.add('hide'); $('q').value=P[i].m; $('dm').value=''; $('dp').value=''; detail(P[i]); }

/* opening a different product always starts from a clean slate -
   parts rarely carry the same discount as the machine */
function openProd(i){ $('dm').value=''; $('dp').value=''; detail(P[i]); }

function detail(prod){
  current=prod;
  const {exact,hitches,groups}=accsFor(prod);
  const d=dM();
  let h='';
  if(results.length>1) h+='<button class="back" onclick="list()">&larr; Back to results</button>';
  h+=`<div class="hero"><div class="hero-m">${esc(prod.m)}</div><div class="hero-d">${esc(prod.d)}</div>
    <div class="hero-p"><div><div class="pl">List price</div><div class="pv ${d?'was':''}">${money(prod.p)}</div></div>
    ${d?`<div style="text-align:right"><div class="pl red">Your price &minus;${d}%</div><div class="pv red">${money(net(prod.p,'m'))}</div></div>`:''}</div></div>`;

  h+=`<div class="acc ${inCart(prod.m)?'on':''}" onclick="toggle(${JSON.stringify(prod).replace(/"/g,'&quot;')},1)">
    <div class="tick">&#10003;</div><div class="acc-i"><div class="acc-m">Add ${esc(prod.m)} to quote</div>
    <div class="acc-d">The machine itself</div></div>
    <div class="acc-p">${d?`<small>${money(prod.p)}</small>`:''}${money(net(prod.p,'m'))}</div></div>`;

  if(hitches.length){
    h+='<div class="grp">Choose a hitch / coupler</div>';
    h+=hitches.map(a=>accRow(a,true)).join('');
  }
  if(exact.length){
    h+=`<div class="grp">Fits this model (${exact.length})</div>`;
    h+=exact.map(a=>accRow({m:a.m,d:a.d,p:a.p},false)).join('');
  }
  for(const g of groups){
    h+=`<div class="grp">${g.label} (${g.items.length})</div>`;
    h+=g.items.map(a=>accRow({m:a.m,d:a.d,p:a.p},false)).join('');
  }
  if(!exact.length&&!groups.length&&!hitches.length)
    h+='<div class="empty">No accessories listed against this model in the price file.</div>';
  $('out').innerHTML=h;
  window.scrollTo(0,0);
}

function accRow(a,isHitch){
  const d=dP();
  return `<div class="acc ${inCart(a.m)?'on':''}" onclick="toggle(${JSON.stringify({m:a.m,d:a.d,p:a.p,h:isHitch?1:0}).replace(/"/g,'&quot;')},0)">
    <div class="tick">&#10003;</div>
    <div class="acc-i"><div class="acc-m">${esc(a.m)}</div><div class="acc-d">${esc(a.d)}</div></div>
    <div class="acc-p">${d?`<small>${money(a.p)}</small>`:''}${money(net(a.p,'p'))}</div></div>`;
}

/* ---------------- quote ---------------- */
function toggle(o,isMain){
  const m=o.m;
  const i=cart.findIndex(l=>l.m===m);
  if(i>-1) cart.splice(i,1);
  else{
    // only one hitch at a time
    if(o.h){const hs=[...HITCH.mixer,...HITCH.gen].map(x=>x.m);
      cart=cart.filter(l=>!hs.includes(l.m));}
    cart.push({m:o.m,d:o.d,p:o.p,k:isMain?'m':'p'});
  }
  if(current) detail(current);
  quote();
}

function drop(i){ cart.splice(i,1); if(current) detail(current); quote(); }

function clearQ(){ cart=[]; if(current) detail(current); quote(); }

function quote(){
  $('qn').textContent=cart.length?`(${cart.length})`:'';
  if(!cart.length){
    $('qbody').innerHTML='<div class="q-none">Tap any item to add it here</div>';
    $('qfoot').innerHTML=''; $('qtot').textContent='$0.00';
    return;
  }
  const listT=cart.reduce((s,l)=>s+l.p,0), netT=cart.reduce((s,l)=>s+net(l.p,l.k),0);
  $('qbody').innerHTML=cart.map((l,i)=>`<div class="q-line">
    <div class="n"><div class="nm">${esc(l.m)}${rateFor(l.k)?` <span style="color:#DC143C;font-weight:600">&minus;${rateFor(l.k)}%</span>`:''}</div>
    <div class="ds">${esc(l.d)}</div></div>
    <div class="pr">${money(net(l.p,l.k))}</div><div class="x" onclick="drop(${i})">&times;</div></div>`).join('');
  $('qfoot').innerHTML=
    (listT>netT?`<div class="q-sum"><span>List total</span><span>${money(listT)}</span></div>
        <div class="q-sum"><span>Discount</span><span>&minus;${money(listT-netT)}</span></div>`:'')+
    `<div class="q-sum big"><span>Total</span><span>${money(netT)}</span></div>
     <button class="q-btn" onclick="copyQ(event)">Copy quote</button>
     <button class="q-btn" onclick="clearQ()">Clear</button>`;
  $('qtot').textContent=money(netT);
}

function copyQ(ev){
  let t=cart.map(l=>{const r=rateFor(l.k);
    return `${l.m}  ${l.d}  ${money(l.p)}`+(r?`  -${r}%  ${money(net(l.p,l.k))}`:'');}).join('\n');
  t+=`\nTOTAL: ${money(cart.reduce((s,l)=>s+net(l.p,l.k),0))} CAD`;
  navigator.clipboard?.writeText(t).then(()=>{
    const b=ev.target; const o=b.textContent; b.textContent='Copied';
    setTimeout(()=>b.textContent=o,1200);
  });
}

/* ---------------- wiring ---------------- */
$('q').addEventListener('input',suggest);
$('q').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('q').blur();go($('q').value);}});
$('clr').onclick=()=>{$('q').value='';$('clr').classList.remove('on');$('sug').classList.add('hide');$('out').innerHTML='';results=[];current=null;};
const redraw=()=>{ if(current) detail(current); else if(results.length>1) list(); quote(); };
$('dm').addEventListener('input',redraw);
$('dp').addEventListener('input',redraw);
$('qbar').onclick=()=>{shut=!shut;$('quote').classList.toggle('shut',shut);$('chev').innerHTML=shut?'&#9650;':'&#9660;';};
document.addEventListener('click',e=>{ if(!e.target.closest('.sbox')) $('sug').classList.add('hide'); });
chips(); quote();
</script>
</body>
</html>
